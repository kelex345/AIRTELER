
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halopesa Promo</title>
  <style>
    :root {
      --bg: #f64718;
      --bg-deep: #ef3d0c;
      --gold-1: #f8d458;
      --gold-2: #eabf33;
      --gold-3: #d69514;
      --white: #f7f7f7;
      --paper: #f3f3f3;
      --text-dark: #3d1d15;
      --shadow: rgba(118, 22, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: #fff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .promo {
      position: relative;
      width: 100%;
      max-width: 820px;
      min-height: 100vh;
      padding: 26px 32px 38px;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      overflow: hidden;
    }

    .promo::before,
    .promo::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 200px;
      background: linear-gradient(180deg, rgba(255,255,255,0), rgba(0,0,0,0.08));
      pointer-events: none;
    }

    .confetti {
      position: absolute;
      width: 14px;
      height: 26px;
      background: rgba(255,255,255,0.9);
      transform: rotate(42deg);
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.2);
      opacity: 0.9;
    }

    .confetti:nth-child(1) { left: 10%; top: 18%; }
    .confetti:nth-child(2) { left: 22%; top: 14%; transform: rotate(22deg); }
    .confetti:nth-child(3) { right: 18%; top: 20%; transform: rotate(-30deg); }
    .confetti:nth-child(4) { right: 11%; top: 16%; }
    .confetti:nth-child(5) { left: 13%; top: 52%; }
    .confetti:nth-child(6) { right: 15%; top: 57%; }
    .confetti:nth-child(7) { left: 56%; top: 15%; transform: rotate(60deg); }
    .confetti:nth-child(8) { left: 74%; top: 64%; transform: rotate(-22deg); }
    .confetti:nth-child(9) { left: 32%; top: 70%; }
    .confetti:nth-child(10) { right: 31%; top: 70%; transform: rotate(30deg); }
    .confetti:nth-child(11) { left: 46%; top: 24%; }
    .confetti:nth-child(12) { left: 66%; top: 35%; }

    .logo {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 6px;
      margin-bottom: 12px;
      font-weight: 900;
      font-size: clamp(2.2rem, 5vw, 5rem);
      line-height: 1;
      color: #fff;
      letter-spacing: -0.08em;
      text-transform: lowercase;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #fff;
      position: relative;
      box-shadow: inset 0 0 0 8px #ff5d23;
      transform: translateY(-2px);
    }

    .logo-mark::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      right: -8px;
      top: 8px;
      transform: scale(0.9);
    }

    .logo-text {
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-style: normal;
      font-weight: 900;
      letter-spacing: -0.08em;
      text-shadow: 0 4px 0 rgba(128, 18, 0, 0.12);
    }

    .event-tag {
      position: relative;
      z-index: 2;
      margin-top: 6px;
      text-align: center;
      font-size: 1.1rem;
      letter-spacing: 0.22em;
      font-weight: 800;
      color: rgba(255,255,255,0.95);
    }

    .hero-number {
      position: relative;
      z-index: 2;
      margin: 12px auto 18px;
      width: fit-content;
      text-align: center;
      font-size: clamp(7.5rem, 20vw, 18rem);
      line-height: 0.72;
      font-weight: 900;
      letter-spacing: -0.12em;
      color: #f5f5f5;
      text-shadow: 0 0 0 #fff, 0 8px 0 rgba(140, 57, 0, 0.15), 0 12px 16px rgba(0,0,0,0.12);
      -webkit-text-stroke: 8px #f4c64d;
      transform: scaleY(0.88);
    }

    .hero-number-wrap {
      position: relative;
      display: inline-block;
      filter: drop-shadow(0 20px 15px rgba(0,0,0,0.12));
    }

    .hero-number-wrap::before,
    .hero-number-wrap::after {
      content: "";
      position: absolute;
      width: 170%;
      height: 54px;
      left: -35%;
      border-radius: 90px;
      border: 8px solid rgba(255, 203, 56, 0.95);
      border-bottom: 0;
      border-left-color: transparent;
      border-right-color: transparent;
      transform: translateY(92px) rotate(-14deg);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.15);
    }

    .hero-number-wrap::after {
      transform: translateY(92px) rotate(14deg);
      border-bottom: 0;
      border-left-color: transparent;
      border-right-color: transparent;
    }

    .hero-number-wrap .ribbon {
      position: absolute;
      width: 130%;
      height: 52px;
      left: -15%;
      top: 47%;
      border-radius: 35px;
      background: linear-gradient(90deg, rgba(250,112,34,0.8), rgba(255,210,74,0.9), rgba(250,104,24,0.8));
      border: 5px solid rgba(255, 236, 142, 0.7);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.2);
      transform: rotate(-16deg);
      opacity: 0.9;
    }

    .hero-number-wrap .ribbon.r2 {
      transform: rotate(16deg);
      top: 51%;
    }

    .hero-text {
      position: relative;
      z-index: 2;
      margin: 0 auto 18px;
      max-width: 760px;
      text-align: center;
      color: #fff;
      text-shadow: 0 4px 0 rgba(128, 24, 0, 0.14);
    }

    .hero-text h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 4.2rem);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .hero-text p {
      margin: 22px auto 0;
      max-width: 700px;
      font-size: clamp(1.2rem, 2vw, 2rem);
      line-height: 1.35;
      font-weight: 500;
      color: rgba(255,255,255,0.97);
    }

    .prize-box {
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 24px auto 22px;
      border: 4px solid rgba(255, 196, 31, 0.95);
      border-radius: 18px;
      background: linear-gradient(180deg, #e72014 0%, #ce1a0b 100%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08), 0 10px 18px rgba(120, 17, 0, 0.22);
      padding: 18px 18px 14px;
      text-align: center;
    }

    .prize-label {
      font-size: clamp(1.2rem, 2vw, 2.5rem);
      color: #f7d260;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .prize-amount {
      font-size: clamp(2.8rem, 5vw, 6rem);
      line-height: 1;
      color: #f7d260;
      font-weight: 900;
      letter-spacing: -0.06em;
      text-shadow: 0 6px 0 rgba(119, 18, 0, 0.22);
    }

    .field-stack {
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      width: 100%;
      border: 0;
      border-radius: 18px;
      background: rgba(255,255,255,0.9);
      color: #2f2f2f;
      font-size: clamp(1.1rem, 2vw, 2.2rem);
      padding: 18px 22px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
      outline: none;
    }

    .field::placeholder {
      color: #4d4848;
      opacity: 0.9;
    }

    .cta {
      position: relative;
      z-index: 2;
      display: block;
      max-width: 700px;
      width: 100%;
      margin: 26px auto 0;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(180deg, #f7d768 0%, #f0c63d 100%);
      color: #f04b1a;
      font-size: clamp(2rem, 3vw, 3.4rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      padding: 18px 22px;
      box-shadow: 0 12px 0 rgba(171, 91, 0, 0.18), 0 16px 20px rgba(124, 27, 0, 0.14);
      cursor: pointer;
    }

    @media (max-width: 720px) {
      .promo {
        padding-left: 18px;
        padding-right: 18px;
      }

      .logo {
        gap: 8px;
      }

      .logo-mark {
        width: 28px;
        height: 28px;
      }

      .event-tag {
        letter-spacing: 0.12em;
      }

      .hero-number-wrap::before,
      .hero-number-wrap::after {
        width: 170%;
        left: -35%;
      }
    }

    @media (max-width: 520px) {
      body {
        overflow: auto;
      }

      .promo {
        min-height: 100vh;
      }

      .field {
        padding-top: 15px;
        padding-bottom: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="promo">
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

    <div class="logo" aria-label="Halopesa">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-text">halopesa</span>
    </div>

    <div class="event-tag">SHEREHE</div>

    <div class="hero-number">
      <div class="hero-number-wrap">
        <span class="ribbon"></span>
        <span class="ribbon r2"></span>
        10
      </div>
    </div>

    <div class="hero-text">
      <h1>Hongera! Umechaguliwa<br />Kupata Zawadi Kubwa</h1>
      <p>
        Karibu Halopesa! Jina lako limechaguliwa kushiriki katika kampeni maalum ya miaka 10 ya Halopesa.
      </p>
    </div>

    <div class="prize-box">
      <div class="prize-label">Zawadi yako ni:</div>
      <div class="prize-amount">Tsh 2,000,000</div>
    </div>

    <div class="field-stack">
      <input class="field" type="text" placeholder="Jina lako la Mxxx" aria-label="Jina lako la Mxxx" />
      <input class="field" type="text" placeholder="Namba ya YAS" aria-label="Namba ya YAS" />
    </div>

    <button class="cta" type="button">INGIA SASA</button>
  </main>
</body>
</html>
